<style>
  :root {
    --red: #c8102e;
    --red-dark: #9a0c23;
    --red-soft: #fdecef;
    --gray-900: #1f2329;
    --gray-700: #4a525c;
    --gray-500: #8a929c;
    --gray-300: #d5dae0;
    --gray-200: #e7eaee;
    --gray-100: #f3f5f7;
    --gray-50: #fafbfc;
    --white: #ffffff;
    --green: #2d8a4e;
    --amber: #b87a00;
    --shadow-sm: 0 1px 2px rgba(20, 24, 30, 0.06);
    --shadow-md: 0 4px 12px rgba(20, 24, 30, 0.08);
    --shadow-lg: 0 12px 32px rgba(20, 24, 30, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--gray-100);
    color: var(--gray-900);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* ---------- Login Screen ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, var(--gray-100) 0%, var(--gray-200) 100%);
  }
  .login-card {
    background: var(--white);
    border-radius: 12px;
    padding: 40px 32px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 380px;
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .login-logo-mark {
    width: 36px;
    height: 36px;
    background: var(--red);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-weight: 700;
    font-size: 18px;
  }
  .login-logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .login-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .login-subtitle { color: var(--gray-500); margin-bottom: 24px; font-size: 13px; }

  /* ---------- App Shell ---------- */
  .app { display: flex; min-height: 100vh; }

    gap: 10px;
    padding: 10px 12px;
    color: rgba(255,255,255,0.7);

  .nav-item .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item .nav-badge {

    background: var(--red);
    color: var(--white);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
  }
  .nav-item.active .nav-badge { background: var(--white); color: var(--red); }

  .user-avatar {

    height: 34px;
    background: var(--red);

    align-items: center;

    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;

  .user-role { font-size: 11px; color: rgba(255,255,255,0.5); }
  .logout-btn {
    color: rgba(255,255,255,0.5);

    border-radius: 4px;

  .main {

    height: 60px;

    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
  }
  .page-title { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .bell-btn {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--gray-100);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-700);
    position: relative;
  }
  .bell-btn:hover { background: var(--gray-200); }
  .bell-dot {
    position: absolute;
    top: 8px;
    right: 9px;
    width: 8px;
    height: 8px;
    background: var(--red);
    border: 2px solid var(--white);
    border-radius: 50%;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.15s;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary { background: var(--red); color: var(--white); }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-secondary { background: var(--white); color: var(--gray-900); border-color: var(--gray-300); }
  .btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-500); }
  .btn-ghost { background: transparent; color: var(--gray-700); }
  .btn-ghost:hover { background: var(--gray-100); color: var(--gray-900); }
  .btn-danger { background: var(--white); color: var(--red); border-color: var(--gray-300); }
  .btn-danger:hover { background: var(--red-soft); border-color: var(--red); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-full { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Forms ---------- */
  .field { margin-bottom: 16px; }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;

  .field-input:focus, .field-select:focus {

    border-color: var(--red);

    color: var(--gray-700);

  .field-hint { font-size: 11px; color: var(--gray-500); margin-top: 4px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .select-wrap .add-new-btn {

    color: var(--gray-700);
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 4px;
    border: 1px solid var(--gray-200);

  .select-wrap .add-new-btn:hover { background: var(--red); color: var(--white); border-color: var(--red); }

  .panel {
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--gray-200);
  }
  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .panel-title { font-size: 15px; font-weight: 600; }

  .panel-body { padding: 20px; }

  .form-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .form-layout { grid-template-columns: 1fr; }

  .summary-card {
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 20px;

    padding: 16px 20px;
    background: var(--gray-900);
    color: var(--white);
    border-radius: 12px 12px 0 0;

    font-weight: 700;
    margin-top: 4px;

    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 13px;

  .summary-row.divider { border-top: 1px solid var(--gray-200); margin-top: 8px; padding-top: 12px; }
  .summary-label { color: var(--gray-500); }
  .summary-value { font-weight: 600; }
  .summary-footer { padding: 0 20px 20px; }

  /* ---------- Table ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--gray-200);
    background: var(--gray-50);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--gray-200);
    font-size: 13px;
    vertical-align: middle;

  tbody tr:last-child td { border-bottom: none; }
  .td-bold { font-weight: 600; }
  .td-money { font-weight: 600; font-variant-numeric: tabular-nums; }
  .td-actions { display: flex; gap: 4px; justify-content: flex-end; }

  /* ---------- Status badges ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge-pending { background: #fff5e0; color: var(--amber); }
  .badge-approved { background: #e6f4ec; color: var(--green); }
  .badge-rejected { background: var(--red-soft); color: var(--red); }
  .badge-negotiation { background: #e8f0fc; color: #1e5db3; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 30, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--white);
    border-radius: 12px;

    gap: 8px;
    justify-content: flex-end;

  .notif-dropdown {

    top: 50px;
    right: 20px;

  .notif-clear { margin-left: auto; font-size: 12px; color: var(--red); font-weight: 600; }

  .notif-item {

    border-bottom: 1px solid var(--gray-100);
    display: flex;
    gap: 10px;
    cursor: pointer;
    transition: background 0.1s;

  .notif-item:hover { background: var(--gray-50); }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--red-soft); }
  .notif-item.unread:hover { background: #fbe3e8; }
  .notif-dot {
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .notif-item:not(.unread) .notif-dot { background: transparent; }
  .notif-content { flex: 1; }
  .notif-text { font-size: 13px; color: var(--gray-900); }
  .notif-time { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
  .notif-empty { padding: 24px 16px; text-align: center; color: var(--gray-500); font-size: 13px; }

  .admin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .admin-grid { grid-template-columns: 1fr; }
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-500);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;

  .tab.active { color: var(--red); border-bottom-color: var(--red); }
  .tab:hover:not(.active) { color: var(--gray-900); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-500);
  }
  .empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state-title { font-size: 14px; font-weight: 600; color: var(--gray-700); margin-bottom: 4px; }
  .empty-state-text { font-size: 13px; }

  .demo-hint {
    background: #fff8e1;
    border: 1px solid #ffe082;
    color: #6b4f00;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .demo-hint strong { color: #4a3700; }

  /* Mobile responsive */
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      padding: 8px;

    .sidebar-header { width: 100%; padding: 8px 12px; border-bottom: none; }
    .sidebar-nav { display: flex; gap: 4px; padding: 0 8px 8px; flex: 1 1 100%; overflow-x: auto; }
    .nav-item { flex-direction: column; padding: 8px 10px; font-size: 11px; min-width: 70px; text-align: center; }
    .nav-item .nav-badge { position: absolute; top: 4px; right: 4px; margin: 0; }
    .sidebar-footer { width: 100%; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: none; }
    .field-row { grid-template-columns: 1fr; }
    .content { padding: 16px; }
    .topbar { padding: 0 16px; }
    .summary-card { position: static; }
    thead { display: none; }
    tbody td { display: block; padding: 6px 16px; border: none; }
    tbody tr { display: block; border-bottom: 1px solid var(--gray-200); padding: 10px 0; }
    tbody td::before { content: attr(data-label); font-size: 11px; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 2px; font-weight: 600; }
    .td-actions { justify-content: flex-start; padding-top: 8px; }
  }
</style>

// ---------- State management ----------
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Migracja: jeśli stara struktura (typy bez pricesByZone, brak stref), użyj nowych defaultów
      const hasOldTypes = Array.isArray(parsed.concreteTypes) && parsed.concreteTypes.length > 0
        && parsed.concreteTypes.some(t => 'pricePerM3' in t && !('pricesByZone' in t));
      const hasNoZones = !Array.isArray(parsed.zones) || parsed.zones.length === 0;
      if (hasOldTypes || hasNoZones) {
        // zachowaj orders/users/contractors/notifications, podmień strukturę cenową
        return {
          ...defaultState,
          ...parsed,
          zones: defaultState.zones,
          concreteTypes: defaultState.concreteTypes,
          pumpTypes: defaultState.pumpTypes,
          settings: { ...defaultState.settings, ...(parsed.settings || {}), company: { ...defaultState.settings.company, ...(parsed.settings?.company || {}) } },
        };
      }
      return { ...defaultState, ...parsed };
    }
  } catch(e) { console.warn('Load failed:', e); }
  return JSON.parse(JSON.stringify(defaultState));
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { console.warn('Save failed:', e); }
}

function resetDemoData() {
  if (!confirm('Czy na pewno chcesz przywrócić dane demonstracyjne? Wszystkie zamówienia i zmiany zostaną utracone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = JSON.parse(JSON.stringify(defaultState));
  saveState();
  render();
}

// ---------- Helpers ----------
function uid(prefix='id') {
  return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
}
function fmtMoney(n) { return fmt(n) + ' zł'; }

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('pl-PL') + ' ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
}
function fmtRelative(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'przed chwilą';
  if (mins < 60) return mins + ' min temu';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' godz. temu';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + ' dni temu';
  return fmtDate(ts);
}

function initials(name) {
  return name.split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderContractorPreview(contractorId) {

  if (!c || (!c.address && !c.phone && !c.email && !c.nip)) return '';
  return `
    <div style="background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 12px; line-height: 1.6;">
      ${c.address ? `<div style="color: var(--gray-700);">📍 ${esc(c.address)}</div>` : ''}

      ${c.email ? `<div>✉️ <a href="mailto:${esc(c.email)}" style="color: var(--red); text-decoration: none; font-weight: 600;">${esc(c.email)}</a></div>` : ''}
    </div>
  `;
}

// Automatycznie określ strefę na podstawie odległości (km)
function inferZoneId(distance) {
  const km = parseFloat(distance) || 0;
  if (!km) return '';
  const sorted = [...state.zones].sort((a,b) => a.maxKm - b.maxKm);
  for (const z of sorted) {
    if (km <= z.maxKm) return z.id;
  }
  return sorted[sorted.length - 1]?.id || '';
}

function currentUser() {
  if (!state.session) return null;
  return state.users.find(u => u.id === state.session.userId);
}

function unreadCount() {
  const u = currentUser();
  if (!u || u.role !== 'admin') return 0;
  return state.notifications.filter(n => !n.read).length;
}

// ---------- Order calculations ----------
function calc(form) {
  const type = state.concreteTypes.find(t => t.id === form.concreteTypeId);
  const zoneId = form.zoneId || inferZoneId(form.distance);
  const zone = state.zones.find(z => z.id === zoneId);
  // sugerowana cena: z tabeli pricesByZone dla wybranej strefy
  const suggestedPricePerM3 = (type && zoneId && type.pricesByZone)
    ? (type.pricesByZone[zoneId] || 0)
    : 0;
  const pricePerM3 = parseFloat(form.pricePerM3Override) || suggestedPricePerM3;
  const pricePerKm = parseFloat(form.pricePerKmOverride) || state.settings.transportPricePerKm;
  const volume = parseFloat(form.volume) || 0;
  const distance = parseFloat(form.distance) || 0;
  // Transport: cena × km × (2 jeśli w 2 strony)
  const distanceMultiplier = state.settings.transportRoundTrip ? 2 : 1;
  const concreteTotal = volume * pricePerM3;
  const transportTotal = distance * distanceMultiplier * pricePerKm;
  const grandTotal = concreteTotal + transportTotal;
  return {
    pricePerM3, pricePerKm, volume, distance,
    zoneId, zone, suggestedPricePerM3,
    concreteTotal, transportTotal, grandTotal,
    distanceMultiplier,
  };
}

// ---------- Notifications ----------
function notifyAdmins(text, orderId) {
  state.users.filter(u => u.role === 'admin').forEach(a => {
    state.notifications.unshift({
      id: uid('n'),
      forUserId: a.id,
      text,
      orderId,
      ts: Date.now(),
      read: false,
    });
  });
  saveState();
}

        </form>

          <div>

function bindLogin() {
  const loginInput = document.getElementById('loginInput');
  const passInput = document.querySelector('#loginForm input[name="password"]');
  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('loginError');

  if (loginInput) {
    try { loginInput.focus(); } catch(e) {}
  }

  function doLogin() {
    const login = (loginInput?.value || '').trim();
    const password = passInput?.value || '';
    if (!login || !password) {
      if (errEl) {
        errEl.textContent = 'Podaj login i hasło.';
        errEl.style.display = 'block';
      }
      return;
    }
    const user = state.users.find(u => u.login === login && u.password === password);
    if (!user) {
      if (errEl) {
        errEl.textContent = 'Nieprawidłowy login lub hasło.';
        errEl.style.display = 'block';
      }
      return;
    }
    state.session = { userId: user.id };
    saveState();
    ui.view = user.role === 'admin' ? 'orders' : 'new';
    render();
  }

  // Submit handler (Enter w polu, klik przycisku type=submit)
  if (form) {
    form.addEventListener('submit', e => {
      e.preventDefault();
      doLogin();
    });
  }

  // Backup: direct click on the submit button — działa nawet jeśli submit się nie odpali
  const submitBtn = form?.querySelector('button[type="submit"]');
  if (submitBtn) {
    submitBtn.addEventListener('click', e => {
      e.preventDefault();
      doLogin();
    });
  }

  // Enter w polu hasła
  if (passInput) {
    passInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        doLogin();
      }
    });
  }
}

// ----- Orders list -----
function renderOrdersList() {
  const u = currentUser();
  const isAdmin = u.role === 'admin';
  // Pracownik widzi zamówienia, które stworzył ALBO w których jest sprzedawcą.
  // Admin widzi wszystkie.
  const visibleOrders = isAdmin
    ? state.orders
    : state.orders.filter(o => o.createdBy === u.id || o.salespersonId === u.id);

  if (visibleOrders.length === 0) {
    return `
      <div class="panel">
        <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          <div class="empty-state-title">${state.orders.length === 0 ? 'Brak zamówień' : 'Brak Twoich zamówień'}</div>
          <div class="empty-state-text">${state.orders.length === 0 ? 'Utwórz pierwsze zamówienie, klikając „Nowe zamówienie".' : 'Widzisz tutaj tylko zamówienia, które utworzyłeś lub w których jesteś sprzedawcą.'}</div>
        </div>
      </div>
    `;
  }
  const sorted = [...visibleOrders].sort((a,b) => b.ts - a.ts);

  return `
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nr</th>
              <th>Data</th>
              <th>Kontrahent</th>
              <th>Typ</th>
              <th>m³</th>
              <th>Sprzedawca</th>
              ${isAdmin ? '<th>Utworzył</th>' : ''}
              <th>Cena końcowa</th>
              <th>Status</th>
              ${isAdmin ? '<th></th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${sorted.map(o => renderOrderRow(o, isAdmin)).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderOrderRow(o, isAdmin) {
  const contractor = state.contractors.find(c => c.id === o.contractorId)?.name || '—';
  const type = state.concreteTypes.find(t => t.id === o.concreteTypeId)?.name || '—';
  const sp = state.users.find(u => u.id === o.salespersonId)?.name || '—';
  const creator = state.users.find(u => u.id === o.createdBy)?.name || '—';
  return `
    <tr data-order-id="${o.id}" class="row-clickable">
      <td data-label="Nr" class="td-bold">#${o.number}</td>
      <td data-label="Data">${fmtDate(o.ts)}</td>
      <td data-label="Kontrahent">${esc(contractor)}</td>
      <td data-label="Typ">${esc(type)}</td>
      <td data-label="m³">${fmt(o.volume)}</td>
      <td data-label="Sprzedawca">${esc(sp)}</td>
      ${isAdmin ? `<td data-label="Utworzył">${esc(creator)}</td>` : ''}
      <td data-label="Cena końcowa" class="td-money">${fmtMoney(o.grandTotal)}</td>
      <td data-label="Status">${statusBadge(o.status)}</td>
      ${isAdmin ? `
        <td class="td-actions">
          ${o.status === 'pending' ? `
            <button class="btn btn-sm btn-primary" data-approve="${o.id}">Akceptuj</button>
            <button class="btn btn-sm btn-danger" data-reject="${o.id}">Odrzuć</button>
          ` : `
            <button class="btn btn-sm btn-ghost" data-view="${o.id}">Szczegóły</button>
          `}
        </td>
      ` : ''}
    </tr>
  `;
}

function statusBadge(status) {
  const map = {
    pending: { cls: 'badge-pending', txt: 'Oczekuje' },
    approved: { cls: 'badge-approved', txt: 'Zaakceptowane' },
    rejected: { cls: 'badge-rejected', txt: 'Odrzucone' },
    negotiation: { cls: 'badge-negotiation', txt: 'Negocjacja' },
  };
  const s = map[status] || map.pending;
  return `<span class="badge ${s.cls}">${s.txt}</span>`;
}

}

// ===========================================
// EVENT BINDING
// ===========================================
function bindApp() {
  // Navigation
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      ui.view = el.dataset.nav;
      ui.notifOpen = false;
      if (ui.view === 'new') ui.formData = blankOrderForm();
      render();
    });
  });

  // Logout
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    state.session = null;
    saveState();
    render();
  });

  // Notification bell
  document.getElementById('bellBtn')?.addEventListener('click', e => {
    e.stopPropagation();
    ui.notifOpen = !ui.notifOpen;
    render();
  });

  // Close dropdown when clicking outside
  if (ui.notifOpen) {
    document.addEventListener('click', closeNotifsOnce);
  }

  // Clear notifications
  document.getElementById('clearNotifsBtn')?.addEventListener('click', () => {
    const u = currentUser();
    state.notifications.forEach(n => { if (n.forUserId === u.id) n.read = true; });
    saveState();
    render();
  });

  // Notification item click
  document.querySelectorAll('[data-notif]').forEach(el => {
    el.addEventListener('click', () => {
      const n = state.notifications.find(x => x.id === el.dataset.notif);
      if (n) { n.read = true; saveState(); }
      ui.notifOpen = false;
      ui.view = 'orders';
      render();
    });
  });

  bindViewSpecific();
  bindModal();
}

function closeNotifsOnce() {
  ui.notifOpen = false;
  document.removeEventListener('click', closeNotifsOnce);
  render();
}

function bindViewSpecific() {
  if (ui.view === 'new') bindNewOrder();
  if (ui.view === 'orders') bindOrdersList();
  if (ui.view === 'offer') bindOffer();
  if (ui.view === 'admin') bindAdmin();
}

function bindOffer() {
  document.querySelectorAll('[data-offer-tab]').forEach(t => {
    t.addEventListener('click', () => {
      ui.offerTab = t.dataset.offerTab;
      render();
    });
  });
  document.getElementById('offerDownloadOfferBtn')?.addEventListener('click', () => {
    if (state.offerFile) downloadDataUrl(state.offerFile.dataUrl, state.offerFile.name);
  });
  document.getElementById('offerDownloadTemplateBtn')?.addEventListener('click', () => {
    if (state.orderTemplate) downloadDataUrl(state.orderTemplate.dataUrl, state.orderTemplate.name);
  });
}

function updateSummary() {
  // Lightweight in-place update of summary numbers (avoid full re-render that loses input focus)
  const c = calc(ui.formData);
  const card = document.querySelector('.summary-card');
  if (!card) return;
  const rows = card.querySelectorAll('.summary-row .summary-value');
  // Ze strefą rows = [Strefa?, cena/m3, ilość, wartość betonu, cena/km, odległość, wartość transportu]
  // Bez strefy rows = [cena/m3, ilość, wartość betonu, cena/km, odległość, wartość transportu]
  let i = 0;
  if (c.zone) { if (rows[i]) rows[i].textContent = c.zone.name; i++; }
  if (rows[i]) rows[i].textContent = c.pricePerM3 ? fmtMoney(c.pricePerM3) : '—'; i++;
  if (rows[i]) rows[i].textContent = c.volume ? fmt(c.volume) + ' m³' : '—'; i++;
  if (rows[i]) rows[i].textContent = fmtMoney(c.concreteTotal); i++;
  if (rows[i]) rows[i].textContent = fmtMoney(c.pricePerKm); i++;
  if (rows[i]) rows[i].textContent = c.distance ? fmt(c.distance) + ' km' + (c.distanceMultiplier === 2 ? ' × 2' : '') : '—'; i++;
  if (rows[i]) rows[i].textContent = fmtMoney(c.transportTotal);
  const total = card.querySelector('.summary-total');
  if (total) total.textContent = fmtMoney(c.grandTotal);
}

function saveOrder() {
  const f = ui.formData;
  if (!f.contractorId)    return alert('Wybierz kontrahenta.');
  if (!f.concreteTypeId)  return alert('Wybierz typ betonu.');
  if (!f.salespersonId)   return alert('Wybierz sprzedawcę.');
  if (!parseFloat(f.volume))   return alert('Podaj ilość betonu w m³.');
  if (!parseFloat(f.distance) && parseFloat(f.distance) !== 0) return alert('Podaj odległość w km.');

  const c = calc(f);
  const u = currentUser();
  const nextNumber = String((state.orders.length + 1)).padStart(4, '0') + '/' + new Date().getFullYear();

  const order = {
    id: uid('o'),
    number: nextNumber,
    ts: Date.now(),
    // Odbiorca i budowa
    contractorId: f.contractorId,
    buildingName: f.buildingName,
    buildingAddress: f.buildingAddress,
    distance: c.distance,
    zoneId: c.zoneId,
    receiverPerson: f.receiverPerson,
    subcontractorReport: f.subcontractorReport,
    deliveryDate: f.deliveryDate,
    // Specyfikacja
    concreteTypeId: f.concreteTypeId,
    volume: c.volume,
    consistency: f.consistency,
    otherSpec: f.otherSpec,
    // Transport
    unloadType: f.unloadType,
    pumpId: f.pumpId,
    additionalServices: f.additionalServices,
    // Handel
    salespersonId: f.salespersonId,
    offerNumber: f.offerNumber,
    // Ceny
    pricePerM3: c.pricePerM3,
    pricePerKm: c.pricePerKm,
    distanceMultiplier: c.distanceMultiplier,
    concreteTotal: c.concreteTotal,
    transportTotal: c.transportTotal,
    grandTotal: c.grandTotal,
    // Meta
    createdBy: u.id,
    status: u.role === 'admin' ? 'approved' : 'pending',
    history: [
      { ts: Date.now(), userId: u.id, action: 'created', note: 'Zamówienie utworzone.' }
    ],
  };
  state.orders.push(order);

  if (u.role !== 'admin') {
    const contractorName = state.contractors.find(x => x.id === f.contractorId)?.name || '';
    notifyAdmins(`Nowe zamówienie #${order.number} od ${u.name} dla ${contractorName} (${fmtMoney(c.grandTotal)})`, order.id);
  }

  saveState();
  ui.formData = blankOrderForm();
  ui.view = 'orders';
  render();

  setTimeout(() => {
    if (u.role === 'admin') {
      alert(`Zamówienie #${order.number} zostało zapisane i automatycznie zaakceptowane.`);
    } else {
      alert(`Zamówienie #${order.number} zostało zapisane.\nAdministrator otrzymał powiadomienie i podejmie decyzję.`);
    }
  }, 100);
}

function bindOrdersList() {
  document.querySelectorAll('[data-approve]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const o = state.orders.find(x => x.id === b.dataset.approve);

      o.status = 'approved';
      o.history.push({ ts: Date.now(), userId: state.session.userId, action: 'approved', note: 'Zaakceptowane przez administratora.' });
      saveState();
      render();
    });
  });
  document.querySelectorAll('[data-reject]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const o = state.orders.find(x => x.id === b.dataset.reject);
      if (!o) return;
      const reason = prompt('Powód odrzucenia (opcjonalnie):');
      o.status = 'rejected';
      o.history.push({ ts: Date.now(), userId: state.session.userId, action: 'rejected', note: reason ? 'Odrzucone: ' + reason : 'Odrzucone przez administratora.' });
      saveState();

      openOrderDetails(r.dataset.orderId);

// ----- Admin bindings -----
function bindAdmin() {
  document.querySelectorAll('[data-tab]').forEach(t => {
    t.addEventListener('click', () => {
      ui.adminTab = t.dataset.tab;
      render();
    });
  });

  document.getElementById('resetDemoBtn')?.addEventListener('click', resetDemoData);

  // Contractors
  document.getElementById('addContractorAdminBtn')?.addEventListener('click', () => openContractorModal());
  document.querySelectorAll('[data-edit-contractor]').forEach(b => b.addEventListener('click', () => openContractorModal(b.dataset.editContractor)));
  document.querySelectorAll('[data-del-contractor]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('Usunąć tego kontrahenta? Istniejące zamówienia pozostaną, ale stracą powiązaną nazwę.')) return;
    state.contractors = state.contractors.filter(c => c.id !== b.dataset.delContractor);
    saveState(); render();
  }));

  // Types
  document.getElementById('addTypeBtn')?.addEventListener('click', () => openTypeModal());
  document.querySelectorAll('[data-edit-type]').forEach(b => b.addEventListener('click', () => openTypeModal(b.dataset.editType)));
  document.querySelectorAll('[data-del-type]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('Usunąć ten typ betonu?')) return;
    state.concreteTypes = state.concreteTypes.filter(t => t.id !== b.dataset.delType);
    saveState(); render();
  }));

  // Zones
  document.getElementById('addZoneBtn')?.addEventListener('click', () => openZoneModal());
  document.querySelectorAll('[data-edit-zone]').forEach(b => b.addEventListener('click', () => openZoneModal(b.dataset.editZone)));
  document.querySelectorAll('[data-del-zone]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('Usunąć tę strefę? Ceny przypisane do tej strefy w typach betonu zostaną utracone.')) return;
    state.zones = state.zones.filter(z => z.id !== b.dataset.delZone);
    // Wyczyść ceny dla usuniętej strefy
    state.concreteTypes.forEach(t => {
      if (t.pricesByZone) delete t.pricesByZone[b.dataset.delZone];
    });
    saveState(); render();
  }));

  // Users
  document.getElementById('addUserBtn')?.addEventListener('click', () => openUserModal());
  document.querySelectorAll('[data-edit-user]').forEach(b => b.addEventListener('click', () => openUserModal(b.dataset.editUser)));
  document.querySelectorAll('[data-del-user]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('Usunąć tego użytkownika?')) return;
    state.users = state.users.filter(u => u.id !== b.dataset.delUser);
    saveState(); render();
  }));

  // Files: oferta handlowa
  document.getElementById('offerFileInput')?.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      return alert('Plik jest za duży (max 5 MB w trybie demo).');
    }
    try {
      const dataUrl = await fileToDataURL(file);
      state.offerFile = {
        name: file.name,
        mime: file.type,
        size: file.size,
        dataUrl,
        uploadedTs: Date.now(),
        uploadedBy: state.session.userId,
      };
      saveState();
      render();
    } catch(err) {
      alert('Nie udało się wgrać pliku: ' + err.message);
    }
  });
  document.getElementById('downloadOfferBtn')?.addEventListener('click', () => {
    if (state.offerFile) downloadDataUrl(state.offerFile.dataUrl, state.offerFile.name);
  });
  document.getElementById('removeOfferBtn')?.addEventListener('click', () => {
    if (!confirm('Usunąć plik oferty handlowej?')) return;
    state.offerFile = null;
    saveState(); render();
  });

  // Files: szablon zamówienia
  document.getElementById('templateFileInput')?.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      return alert('Plik jest za duży (max 5 MB w trybie demo).');
    }
    try {
      const dataUrl = await fileToDataURL(file);
      state.orderTemplate = {
        name: file.name,
        mime: file.type,
        size: file.size,
        dataUrl,
        uploadedTs: Date.now(),
        uploadedBy: state.session.userId,
      };
      saveState();
      render();
    } catch(err) {
      alert('Nie udało się wgrać pliku: ' + err.message);
    }
  });
  document.getElementById('downloadTemplateBtn')?.addEventListener('click', () => {
    if (state.orderTemplate) downloadDataUrl(state.orderTemplate.dataUrl, state.orderTemplate.name);
  });
  document.getElementById('removeTemplateBtn')?.addEventListener('click', () => {
    if (!confirm('Usunąć szablon zamówienia?')) return;
    state.orderTemplate = null;
    saveState(); render();
  });

  // Settings
  document.getElementById('saveSettingsBtn')?.addEventListener('click', () => {
    const val = parseFloat(document.getElementById('setting-transport').value);
    if (isNaN(val) || val < 0) return alert('Podaj prawidłową wartość ceny za km.');
    state.settings.transportPricePerKm = val;
    state.settings.transportRoundTrip = document.getElementById('setting-roundtrip').value === 'true';
    state.settings.company = {
      name: document.getElementById('setting-company-name').value.trim(),
      address: document.getElementById('setting-company-address').value.trim(),
      phone: document.getElementById('setting-company-phone').value.trim(),
      email: document.getElementById('setting-company-email').value.trim(),
      www: document.getElementById('setting-company-www').value.trim(),
    };
    saveState();
    alert('Ustawienia zapisane.');
  });
}

// ----- PDF generation -----
function generateOrderPdf(o) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('Biblioteka generowania PDF nie została załadowana. Sprawdź połączenie z internetem i odśwież stronę.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const contractor = state.contractors.find(c => c.id === o.contractorId);
  const type = state.concreteTypes.find(t => t.id === o.concreteTypeId);
  const sp = state.users.find(u => u.id === o.salespersonId);
  const zone = state.zones.find(z => z.id === o.zoneId);
  const pump = state.pumpTypes.find(p => p.id === o.pumpId);
  const company = state.settings.company || {};

  // jsPDF nie radzi sobie z polskimi znakami w domyślnej czcionce - zamieniamy
  function pl(s) {
    if (s == null) return '';
    return String(s)
      .replace(/ą/g,'a').replace(/Ą/g,'A')
      .replace(/ć/g,'c').replace(/Ć/g,'C')
      .replace(/ę/g,'e').replace(/Ę/g,'E')
      .replace(/ł/g,'l').replace(/Ł/g,'L')
      .replace(/ń/g,'n').replace(/Ń/g,'N')
      .replace(/ó/g,'o').replace(/Ó/g,'O')
      .replace(/ś/g,'s').replace(/Ś/g,'S')
      .replace(/ź/g,'z').replace(/Ź/g,'Z')
      .replace(/ż/g,'z').replace(/Ż/g,'Z');
  }

  // === HEADER: dane firmy ===
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text(pl('SIEDZIBA FIRMY:'), 20, 18);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(pl(company.address || ''), 20, 24);
  doc.text(pl(company.email || ''), 20, 29);
  doc.text(pl('Centrala – ' + (company.phone || '')), 20, 34);

  // Logo w prawym górnym rogu
  try {
    doc.addImage(LOGO_URI, 'PNG', 158, 12, 32, 32);
  } catch(e) { console.warn('Nie udało się dodać logo:', e); }

  // === TYTUŁ ===
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text(pl(`ZAMÓWIENIE NR ${o.number}  Z DNIA ${new Date(o.ts).toLocaleDateString('pl-PL')}`), 20, 46);
  if (o.offerNumber) {
    doc.setFontSize(10);
    doc.text(pl(`Zgodne z ofertą cenową nr ${o.offerNumber}`), 20, 52);
  }

  // === I. DANE ODBIORCY ===
  let y = 60;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setFillColor(200, 16, 46);
  doc.setTextColor(255, 255, 255);
  doc.rect(20, y, 170, 7, 'F');
  doc.text(pl('I. DANE ODBIORCY'), 22, y + 5);
  doc.setTextColor(0, 0, 0);
  y += 11;

  doc.autoTable({
    startY: y,
    head: [],
    body: [
      [{ content: pl('Pełne dane Odbiorcy'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(
         `${contractor?.clientType === 'indywidualny' ? 'KLIENT INDYWIDUALNY' : 'FIRMA'}\n` +
         `Nazwa: ${contractor?.name || ''}\n` +
         `Adres: ${contractor?.address || ''}\n` +
         (contractor?.nip ? `NIP/REGON: ${contractor.nip}\n` : '')
       )}],
      [{ content: pl('Dane kontaktowe'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(
         (contractor?.phone ? `Telefon: ${contractor.phone}\n` : '') +
         (contractor?.email ? `E-mail: ${contractor.email}` : '')
       )}],
      [{ content: pl('Nazwa i adres budowy'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(
         `Nazwa budowy: ${o.buildingName || ''}\n` +
         `Adres: ${o.buildingAddress || ''}\n` +
         `Odległość: ${o.distance || ''} km${o.distanceMultiplier === 2 ? ' (×2 strony)' : ''} (${zone?.name || ''})`
       )}],
      [{ content: pl('Osoba upoważniona do odbioru'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(o.receiverPerson || '')}],
      [{ content: pl('Zgłoszenie podwykonawcy do Inwestora'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl((o.subcontractorReport || '').toUpperCase() || '—')}],
      [{ content: pl('Termin dostawy'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(o.deliveryDate || '')}],
    ],
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 2 },
    columnStyles: { 0: { cellWidth: 55 }, 1: { cellWidth: 115 } },
    margin: { left: 20, right: 20 },
  });

  y = doc.lastAutoTable.finalY + 6;

  // === II. SPECYFIKACJA ===
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setFillColor(200, 16, 46);
  doc.setTextColor(255, 255, 255);
  doc.rect(20, y, 170, 7, 'F');
  doc.text(pl('II. SPECYFIKACJA ZAMÓWIENIA'), 22, y + 5);
  doc.setTextColor(0, 0, 0);
  y += 11;

  doc.autoTable({
    startY: y,
    head: [],
    body: [
      [{ content: pl('Klasa i rodzaj mieszanki betonowej'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(
         `Klasa betonu: ${type?.name || ''}\n` +
         `Klasa konsystencji: ${o.consistency || ''}\n` +
         `Ilość m³: ${fmt(o.volume)}\n` +
         (o.otherSpec ? `Inne: ${o.otherSpec}` : '')
       )}],
      [{ content: pl('Rodzaj rozładunku'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(o.unloadType || '')}],
      [{ content: pl('Rodzaj pompy'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(pump?.name || '—')}],
      [{ content: pl('Usługi dodatkowe / inne'), styles: { fontStyle: 'bold', fillColor: [243, 245, 247] } },
       { content: pl(o.additionalServices || '')}],
    ],
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 2 },
    columnStyles: { 0: { cellWidth: 55 }, 1: { cellWidth: 115 } },
    margin: { left: 20, right: 20 },
  });

  y = doc.lastAutoTable.finalY + 6;

  // === III. WYCENA ===
  doc.setFillColor(200, 16, 46);
  doc.setTextColor(255, 255, 255);
  doc.rect(20, y, 170, 7, 'F');
  doc.text(pl('III. WYCENA'), 22, y + 5);
  doc.setTextColor(0, 0, 0);
  y += 11;

  doc.autoTable({
    startY: y,
    head: [[pl('Pozycja'), pl('Wartość')]],
    body: [
      [pl('Strefa cenowa'), pl(zone?.name || '—')],
      [pl(`Beton: ${fmt(o.volume)} m³ × ${fmtMoney(o.pricePerM3)}`), fmtMoney(o.concreteTotal).replace('zł','zl')],
      [pl(`Transport: ${fmt(o.distance)} km × ${o.distanceMultiplier === 2 ? '2 strony × ' : ''}${fmtMoney(o.pricePerKm)}`), fmtMoney(o.transportTotal).replace('zł','zl')],
      [{ content: pl('CENA KOŃCOWA NETTO'), styles: { fontStyle: 'bold', fillColor: [231, 234, 238] } },
       { content: fmtMoney(o.grandTotal).replace('zł','zl'), styles: { fontStyle: 'bold', fillColor: [231, 234, 238], halign: 'right' } }],
    ],
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 2.5 },
    headStyles: { fillColor: [60, 70, 80], textColor: 255 },
    columnStyles: { 0: { cellWidth: 115 }, 1: { cellWidth: 55, halign: 'right' } },
    margin: { left: 20, right: 20 },
  });

  y = doc.lastAutoTable.finalY + 10;

  // === Sprzedawca i podpisy ===
  if (y > 240) { doc.addPage(); y = 20; }
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text(pl(`Sprzedawca: ${sp?.name || ''}`), 20, y);
  y += 12;

  doc.line(25, y + 15, 80, y + 15);
  doc.line(115, y + 15, 175, y + 15);
  doc.setFontSize(8);
  doc.text(pl('Podpis Dostawcy'), 38, y + 20);
  doc.text(pl('Podpis Odbiorcy'), 130, y + 20);

  // Stopka
  doc.setFontSize(7);
  doc.setTextColor(120, 120, 120);
  doc.text(pl(`Wygenerowano: ${new Date().toLocaleString('pl-PL')} | ${company.www || ''}`), 105, 290, { align: 'center' });

  // Zapisz
  const fileName = `Zamowienie_${o.number.replace('/', '-')}.pdf`;
  doc.save(fileName);
}

// ----- File helpers (upload base64) -----
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function humanSize(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  return (kb / 1024).toFixed(2) + ' MB';
}

// ----- Modal management -----
function openModal(config) {
  ui.modal = config;
  render();
  if (config.onMount) config.onMount();
}
function closeModal() {
  ui.modal = null;
  render();
}
function bindModal() {
  if (!ui.modal) return;
  document.getElementById('modalOverlay')?.addEventListener('click', closeModal);
  document.getElementById('modalCloseBtn')?.addEventListener('click', closeModal);
  document.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', closeModal));
  // ESC to close
  document.addEventListener('keydown', escClose);
}
function escClose(e) {
  if (e.key === 'Escape') {
    document.removeEventListener('keydown', escClose);
    closeModal();
  }
}

// ----- PWA: Install prompt -----
let deferredInstallPrompt = null;

function showInstallButtonIfReady() {
  if (deferredInstallPrompt) {
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'inline-flex';
  }
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallButtonIfReady();
});

document.addEventListener('click', e => {
  if (e.target.closest('#installBtn') && deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(() => {
      deferredInstallPrompt = null;
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'none';
    });
  }
});

// Obserwuj DOM - po każdym renderze pokaż przycisk install jeśli mamy prompt
const installObserver = new MutationObserver(() => showInstallButtonIfReady());
installObserver.observe(document.getElementById('root'), { childList: true, subtree: true });

// ----- Init -----
render();

// ----- PWA: rejestracja Service Workera (inline blob) -----
// Dla działania offline. SW jest tworzony z blob URL, bo plik jest jednoplikowy.
// W produkcji byłby to osobny plik /sw.js z odpowiednim MIME type.
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'betonorder-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      // Cache-first dla zewnętrznych zasobów (jsPDF z CDN)
      if (e.request.url.startsWith('https://cdnjs.cloudflare.com')) {
        e.respondWith(
          caches.open(CACHE).then(cache =>
            cache.match(e.request).then(resp => resp || fetch(e.request).then(r => {
              cache.put(e.request, r.clone());
              return r;
            }).catch(() => resp))
          )
        );
      }
    });
  `;
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(err => {
      console.log('SW registration failed (this is OK on file:// protocol):', err.message);
    });
  } catch(e) { /* file:// protocol: SW not available, that's fine */ }
}
